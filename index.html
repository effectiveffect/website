<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>effectiveffect - setting trends</title>
  <!-- Share-card BODY TEXT lives here. Edit BOTH "description" values below to
       change what WhatsApp / Facebook / etc. show under the title. -->
  <meta name="description" content="effectiveffect">

  <!-- Open Graph: the social/chat share card (WhatsApp, Facebook, Telegram,
       iMessage, LinkedIn…). URLs MUST be absolute and match where the site is
       actually served — update them if you deploy somewhere other than the
       custom domain below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="effectiveffect">
  <meta property="og:title" content="effectiveffect - setting trends">
  <meta property="og:description" content="effectiveffect - setting trends">
  <meta property="og:url" content="https://effectiveffect.com/">
  <meta property="og:image" content="https://effectiveffect.com/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="effectiveffect">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons. Bump the ?v= on ALL of them together whenever an icon file
       changes — browsers and phone launchers cache favicons very hard and
       will otherwise keep showing the old one for weeks. -->

  <!-- favicon.ico and apple-touch-icon.png deliberately stay at the site ROOT:
       clients that never parse this HTML (link scrapers, feed readers, some
       chat previewers) probe /favicon.ico and /apple-touch-icon.png directly.
       Everything referenced only by a tag below lives in icons/. -->

  <!-- Browser tab. Modern browsers take the SVG (crisp at any zoom / DPI);
       everything else falls back to the PNG. -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
  <link rel="alternate icon" type="image/png" href="icons/favicon.png?v=2" sizes="any">
  <link rel="alternate icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">

  <!-- Safari pinned tabs (legacy, macOS only). Renders the logo as a
       silhouette in the given colour, so the source must be monochrome. -->
  <link rel="mask-icon" href="icons/favicon.svg?v=2" color="#e6121c">

  <!-- iOS home screen. MUST be PNG — iOS ignores SVG here, and it composites
       any transparency onto BLACK, so this file has a baked-in white bg. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- Android launcher / PWA icons live in the manifest (192, 512, maskable). -->
  <link rel="manifest" href="site.webmanifest?v=2">
  <meta name="theme-color" content="#e6121c">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content">
    <!-- Hero: WebP with PNG fallback. -->
    <picture>
      <source type="image/webp" srcset="images/hero.webp">
      <img class="hero"
           src="images/hero.png"
           alt="effectiveffect"
           width="1024" height="700">
    </picture>
    
    <br>

    <h1 class="title"><b>SETTING TRENDS.</b></h1>
    <p class="email">
      email: <a href="mailto:effectiveffect@gmail.com">effectiveffect@gmail.com</a>
    </p>

    <br>    
    <!-- <a href="https://effectiveffect.com">effectiveffect.com</a>    -->
  </main>
</body>
</html>
